[chopper_tune]
debug: False
inset: 10
boundary_margin: 1.0
current_change_step: 25
measure_time: 1250
required_rpm: 37.5,150,1.5
delay: 500
fclk: 12.5
results_path: /userdata/gcodes/shaper_calibrate/chopper_magnitude
allow_save_config: False

# Fluidd creates the chevron parameter panel by scanning explicit params.NAME
# references. These assignments intentionally expose every applicable option.
# Values set to "auto" are omitted before calling the Python command.

[gcode_macro SNAPMAKER_CHOPPER_FIND_X_RESONANCES]
description: Find resonance speeds for the U1 stepper_x CoreXY motor
gcode:
    {% set _direction = params.DIRECTION|default(1) %}
    {% set _current_min = params.CURRENT_MIN_MA|default("auto") %}
    {% set _tbl_min = params.TBL_MIN|default("auto") %}
    {% set _toff_min = params.TOFF_MIN|default("auto") %}
    {% set _hstrt_hend_max = params.HSTRT_HEND_MAX|default(16) %}
    {% set _hstrt_min = params.HSTRT_MIN|default("auto") %}
    {% set _hend_min = params.HEND_MIN|default("auto") %}
    {% set _tpfd_min = params.TPFD_MIN|default("auto") %}
    {% set _min_speed = params.MIN_SPEED|default("auto") %}
    {% set _max_speed = params.MAX_SPEED|default("auto") %}
    {% set _speed_step = params.SPEED_CHANGE_STEP|default("auto") %}
    {% set _iterations = params.ITERATIONS|default(1) %}
    {% set _travel = params.TRAVEL_DISTANCE|default("auto") %}
    {% set _axis_min = params.AXIS_MIN|default("auto") %}
    {% set _axis_max = params.AXIS_MAX|default("auto") %}
    {% set _accelerometer = params.ACCELEROMETER|default("default") %}
    {% set _plotter = params.RUN_PLOTTER|default("true") %}
    _SNAPMAKER_CHOPPER_RUN {rawparams} AXIS=X FIND_RESONANCES=true

