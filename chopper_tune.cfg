[chopper_tune]
debug: False
inset: 10
boundary_margin: 1.0
current_change_step: 25
measure_time: 1250
required_rpm: 37.5,150,1.5
delay: 500
fclk: 12.5
results_path: /userdata/gcodes/shaper_calibrate/chopper_magnitude
allow_save_config: False

# Visible U1 workflow macros. The fixed AXIS and FIND_RESONANCES arguments are
# deliberately appended after rawparams so callers cannot redirect an X macro
# to the other CoreXY motor or accidentally switch measurement modes.

[gcode_macro U1_CHOPPER_FIND_X_RESONANCES]
description: Find resonance speeds for the U1 stepper_x CoreXY motor
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {% if state in ["printing", "paused"] %}
        {action_raise_error("Chopper tuning is blocked while a print is active or paused")}
    {% endif %}
    {action_respond_info("Starting U1 stepper_x resonance discovery. Restart Klipper after completion or abort.")}
    CHOPPER_TUNE {rawparams} AXIS=X FIND_RESONANCES=true

[gcode_macro U1_CHOPPER_FIND_Y_RESONANCES]
description: Find resonance speeds for the U1 stepper_y CoreXY motor
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {% if state in ["printing", "paused"] %}
        {action_raise_error("Chopper tuning is blocked while a print is active or paused")}
    {% endif %}
    {action_respond_info("Starting U1 stepper_y resonance discovery. Restart Klipper after completion or abort.")}
    CHOPPER_TUNE {rawparams} AXIS=Y FIND_RESONANCES=true

[gcode_macro U1_CHOPPER_TUNE_X]
description: Tune U1 stepper_x at explicit MIN_SPEED and MAX_SPEED values
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {% if state in ["printing", "paused"] %}
        {action_raise_error("Chopper tuning is blocked while a print is active or paused")}
    {% endif %}
    {% if "MIN_SPEED" not in params or "MAX_SPEED" not in params %}
        {action_raise_error("U1_CHOPPER_TUNE_X requires MIN_SPEED=<mm/s> and MAX_SPEED=<mm/s>")}
    {% endif %}
    {action_respond_info("Starting U1 stepper_x register tuning. Restart Klipper after completion or abort.")}
    CHOPPER_TUNE {rawparams} AXIS=X FIND_RESONANCES=false

[gcode_macro U1_CHOPPER_TUNE_Y]
description: Tune U1 stepper_y at explicit MIN_SPEED and MAX_SPEED values
gcode:
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {% if state in ["printing", "paused"] %}
        {action_raise_error("Chopper tuning is blocked while a print is active or paused")}
    {% endif %}
    {% if "MIN_SPEED" not in params or "MAX_SPEED" not in params %}
        {action_raise_error("U1_CHOPPER_TUNE_Y requires MIN_SPEED=<mm/s> and MAX_SPEED=<mm/s>")}
    {% endif %}
    {action_respond_info("Starting U1 stepper_y register tuning. Restart Klipper after completion or abort.")}
    CHOPPER_TUNE {rawparams} AXIS=Y FIND_RESONANCES=false
