[gcode_macro _SNAPMAKER_CHOPPER_RUN]
description: Internal parameter sanitizer for the visible U1 chopper workflows
gcode:
    {% set axis = params.AXIS|upper %}
    {% set find_resonances = params.FIND_RESONANCES|default("false")|string|lower %}
    {% set state = printer.print_stats.state|default("standby")|lower %}
    {% if state in ["printing", "paused"] %}
        {action_raise_error("Chopper tuning is blocked while a print is active or paused")}
    {% endif %}
    {% if axis not in ["X", "Y"] %}
        {action_raise_error("U1 chopper workflows support AXIS=X or AXIS=Y only")}
    {% endif %}
    {% set direction = params.DIRECTION|default(1)|int %}
    {% if direction not in [-1, 1] %}
        {action_raise_error("DIRECTION must be 1 or -1")}
    {% endif %}
    {% set search = params.SEARCH_METHOD|default("progressive")|string|lower %}
    {% if search not in ["brute_force", "adaptive", "progressive"] %}
        {action_raise_error("SEARCH_METHOD must be brute_force, adaptive, or progressive")}
    {% endif %}
    {% set plotter = params.RUN_PLOTTER|default("true")|string|lower %}
    {% if plotter not in ["0", "1", "false", "true"] %}
        {action_raise_error("RUN_PLOTTER must be true, false, 1, or 0")}
    {% endif %}
    {% set min_speed = params.MIN_SPEED|default("")|string|lower %}
    {% set max_speed = params.MAX_SPEED|default("")|string|lower %}
    {% if find_resonances == "false" and (min_speed in ["", "auto", "required", "default"] or max_speed in ["", "auto", "required", "default"]) %}
        {action_raise_error("Register tuning requires numeric MIN_SPEED and MAX_SPEED values")}
    {% endif %}
    {% set forwarded = [
        "DIRECTION", "SEARCH_METHOD", "CURRENT_MIN_MA", "CURRENT_MAX_MA",
        "TBL_MIN", "TBL_MAX", "TOFF_MIN", "TOFF_MAX", "HSTRT_HEND_MAX",
        "HSTRT_MIN", "HSTRT_MAX", "HEND_MIN", "HEND_MAX", "TPFD_MIN",
        "TPFD_MAX", "MIN_SPEED", "MAX_SPEED", "SPEED_CHANGE_STEP",
        "ITERATIONS", "TRAVEL_DISTANCE", "AXIS_MIN", "AXIS_MAX",
        "ACCELEROMETER", "RUN_PLOTTER", "COMPARE_WITH"
    ] %}
    {% set command = ["CHOPPER_TUNE", "AXIS=" ~ axis, "FIND_RESONANCES=" ~ find_resonances] %}
    {% for name in forwarded %}
        {% if params[name] is defined %}
            {% set value = params[name]|string %}
            {% if value|lower not in ["", "auto", "required"] %}
                {% set _ = command.append(name ~ "=" ~ value) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {action_respond_info("Starting U1 stepper_%s chopper workflow with protected axis bounds. Restart Klipper after completion or abort." % (axis|lower))}
    {command|join(" ")}
